name: RSS Topla

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Repo'yu checkout et
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Toplayiciyi calistir
        run: python collector.py

      - name: Degisiklikleri commit'le ve push'la
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "veri: RSS toplama calismasi"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          file_pattern: "data/haberler.db"
