  - name: "Anadolu Ajansi"
    url: "https://www.aa.com.tr/tr/rss/default?cat=guncel"
    category: "ajans"
    not: "Genel guncel; ekonomi anahtar kelime filtresi gerekir"

  - name: "TRT Haber"
    url: "https://www.trthaber.com/sondakika.rss"
    category: "ajans"
    not: "Son dakika; ekonomi anahtar kelime filtresi gerekir"

