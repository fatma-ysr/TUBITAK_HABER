    url: "https://www.bloomberght.com/rss"
    category: "finans"

  - name: "Dunya Gazetesi"
    url: "https://www.dunya.com/rss?dunya"
    category: "finans"

  - name: "Ekonomim"
    url: "https://www.ekonomim.com/export/rss"
    category: "finans"

  - name: "Foreks"
