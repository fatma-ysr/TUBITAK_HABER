# sources.yaml
# TUBITAK 2209-A projesi icin Turkce ekonomi haberi RSS kaynaklari.
# Yeni kaynak eklemek icin buraya tek bir madde eklemeniz yeterlidir.
# Kullanmadan once her URL'i tarayicida test edin; XML donmuyorsa kaldirin
# ya da sitenin guncel RSS adresini bulup degistirin.

sources:
